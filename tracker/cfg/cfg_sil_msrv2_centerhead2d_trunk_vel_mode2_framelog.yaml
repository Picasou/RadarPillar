  show:
    tp: 1
    fp: 1
    fn: 1
    ids: 1
    frag: 1
    mota: 1
    motp: 1
    mt: 1
    ml: 1
    amota: 1
    amotp: 1
    idf1: 1
    deta: 1
    assa: 1
    hota: 1
    loca: 1
    vae: 1
    vne: 1
    vaie: 1
    vir: 1
    vse: 1
    vde: 1

# ==================================================
# -------------------- 性能评估配置 --------------------
# ==================================================
EVALUATE:
# type: 0=off  1=online(逐帧记账+滚动指标, 序列/数据集两级输出)  2=offline(批量评估+报告落盘)
  type: 0
  report: 1
  template: default
# match_dist: 评估配对距离门限 (m), 中心欧氏距离
  match_dist: 2.0

# ==================================================
#-------------------- 航迹管理配置 -------------------
# ==================================================
MANAGER:
  birth_heat: 3
  death_heat: 3
  # merge_dist: 重复航迹合并距离门限 (m), 中心距小于此值合并 (≤0 关闭)
  merge_dist: 1.0
  # birth_min_range: 近距建轨抑制 (m), 距 ego 小于此值的观测不建轨 (≤0 关闭)
  birth_min_range: 2.0
  prob_output: 80
  dt: 0.1
  history_horizon: 4.0
  adapter:
    smooth: 1
    markov: 1
    # type Markov: class_names 类别表(须与模型 CLASS_NAMES 对齐); p_stay 自环保持率(越大类型越稳); accuracy 量测精度(越大越信单帧, 越小越抗噪)
    type_markov:
      class_names: ["Car", "Pedestrian", "Cyclist", "Truck", "StaticObject"]
      p_stay: 0.95
      accuracy: 0.7

# ==================================================
# -------------------- 逐帧日志 --------------------
# ==================================================
LOG:
# enable: 0=off  1=逐帧日志落盘 (仅 mode=2)
  enable: 1
# level: full=全属性逐行  slim=每帧一行汇总
  level: full
# dir: 空=随数据目录 <序列>/frame_log_mode2.log; 非空=集中 <dir>/<时间戳_run>/
  dir: ''
