stage: 3
note: >
  阶段3 neck 扫描 — 2 块类型 × 3 neck（无/FPN/MDFEN）= 6 格点 + n7（C3 容量补测，planned）。
  底座 A*=a1（BACKBONE_3D=PillarAttention, 7 cfg 一致）。
  standard 块（n1/n2/n3）容量 C1[32,32,32]（= stage2 standard 最优 b1）；
  RepDWC 块（n4/n5/n6）容量 C4[64,64,64]（= stage2 RepDWC 最优 b8）；
  n7: RepDWC C3[64,128,256] + MDFEN（= stage0 baseline 容量, planned）。
  块内三点容量一致、只变 neck（§8.3），块内 neck 对比干净。
protocol: VoD 5f EAA, IoU Car=0.5/Ped·Cyc=0.25, 3D AP moderate R40
adjudication_criterion: Car 3D AP R40 moderate (D13 主判); Params/FLOPs 成本参考
eval_protocol: 末 10 ckpt (ep70-79) GPU eval + pickbest (median of Car R40) + resbag 落袋
pickbest_protocol_note: median (修复前为 max, 2026-08-02 改, 避免 cherry-pick 离群 epoch)
